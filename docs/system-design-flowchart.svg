<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" width="1000" height="1100" role="img" aria-label="Aggie Reminder end-to-end flowchart: an admin's browser loads the static pages served by Express; login.html and register.html POST to /register-user and /login-user, which insert into or exact-match a plaintext PostgreSQL users table through Knex, and on success store name and email in sessionStorage; index.html fetches /api/shifts, which re-reads the first sheet of Test Calendar 2024.xlsx on every request, and posts the reminder form to /send-custom-reminders, which also re-reads that sheet on every POST but only uses it for the broken 'all' branch, then calls sendReminderEmail (sgMail.send) once per address and replies before any send settles. Separately, a time-driven Day timer set up by hand runs senderEmail() in Apps Script, which reads Google Sheet 'Sheet1' and calls MailApp.sendEmail for every cell from column D onward on rows dated at most two days ahead, with no lower bound. Both paths end in the volunteers' inboxes.">
  <style>
    .bg{fill:#ffffff}
    .title{fill:#1f2328;font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .sub{fill:#59636e;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .lbl{fill:#1f2328;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .note{fill:#59636e;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .glbl{fill:#59636e;font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.06em}
    .elbl{fill:#59636e;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .edge{stroke:#818b98;stroke-width:1.6;fill:none}
    .edge-dash{stroke:#818b98;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .arrow{fill:#818b98}
    .group{fill:none;stroke:#d1d9e0;stroke-width:1.2;stroke-dasharray:4 4}
    .b-blue{fill:#ddf4ff;stroke:#54aeff;stroke-width:1.5}
    .b-green{fill:#dafbe1;stroke:#4ac26b;stroke-width:1.5}
    .b-purple{fill:#fbefff;stroke:#c297ff;stroke-width:1.5}
    .b-orange{fill:#fff1e5;stroke:#fb8f44;stroke-width:1.5}
    .b-gray{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1.5}
    .b-red{fill:#ffebe9;stroke:#ff8182;stroke-width:1.5}
    .b-planned{fill:none;stroke:#818b98;stroke-width:1.4;stroke-dasharray:5 4}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .title,.lbl{fill:#e6edf3}
      .sub,.note,.glbl,.elbl{fill:#9198a1}
      .edge,.edge-dash{stroke:#9198a1}
      .arrow{fill:#9198a1}
      .group{stroke:#3d444d}
      .b-blue{fill:#0c2d6b;stroke:#4493f8}
      .b-green{fill:#0f3b1e;stroke:#3fb950}
      .b-purple{fill:#2e1a4f;stroke:#ab7df8}
      .b-orange{fill:#3d1f0a;stroke:#f0883e}
      .b-gray{fill:#151b23;stroke:#3d444d}
      .b-red{fill:#3c1618;stroke:#f85149}
      .b-planned{stroke:#9198a1}
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="1000" height="1100" rx="12"/>
  <text class="title" x="32" y="48">Aggie Reminder — end-to-end flowchart</text>
  <text class="sub" x="32" y="74">Two independent paths to a volunteer's inbox: an Express app over an Excel file, and a daily Apps Script.</text>

  <!-- ===== Admin ===== -->
  <rect class="b-orange" x="380" y="92" width="240" height="56" rx="10"/>
  <text class="lbl" x="500" y="115" text-anchor="middle">Admin — web browser</text>
  <text class="note" x="500" y="135" text-anchor="middle">opens localhost:3000</text>
  <path class="edge" d="M405,148 V212" marker-end="url(#ah)"/>
  <path class="edge" d="M595,148 V212" marker-end="url(#ah)"/>

  <!-- ===== Static frontend ===== -->
  <rect class="group" x="24" y="164" width="952" height="144" rx="12"/>
  <text class="glbl" x="40" y="186">STATIC FRONTEND — hackdavis2024/public/</text>
  <text class="glbl" x="40" y="202">the session lives only in sessionStorage</text>
  <rect class="b-blue" x="40" y="216" width="380" height="76" rx="10"/>
  <text class="lbl" x="230" y="240" text-anchor="middle">login.html / register.html</text>
  <text class="note" x="230" y="259" text-anchor="middle">form.js — fetch POST to the auth routes</text>
  <text class="note" x="230" y="278" text-anchor="middle">on success: sessionStorage.name / .email</text>
  <rect class="b-blue" x="580" y="216" width="380" height="76" rx="10"/>
  <text class="lbl" x="770" y="240" text-anchor="middle">index.html + scripts.js</text>
  <text class="note" x="770" y="259" text-anchor="middle">shifts table — a "Week N" row every 7 rows</text>
  <text class="note" x="770" y="278" text-anchor="middle">reminder form; alert() shows the reply</text>
  <!-- client-side redirects -->
  <path class="edge" d="M420,246 H576" marker-end="url(#ah)"/>
  <text class="elbl" x="500" y="238" text-anchor="middle">after login/register → /</text>
  <path class="edge" d="M580,268 H424" marker-end="url(#ah)"/>
  <text class="elbl" x="500" y="284" text-anchor="middle">no session → /login</text>
  <text class="elbl" x="500" y="298" text-anchor="middle">(home.js gate)</text>

  <!-- ===== frontend <-> Express ===== -->
  <path class="edge" d="M214,408 V296" marker-end="url(#ah)"/>
  <text class="elbl" x="204" y="329" text-anchor="end">serves all 3 pages</text>
  <text class="elbl" x="204" y="343" text-anchor="end">(index.html too)</text>
  <path class="edge" d="M330,292 V404" marker-end="url(#ah)"/>
  <text class="elbl" x="340" y="329">POST /register-user</text>
  <text class="elbl" x="340" y="343">POST /login-user</text>
  <path class="edge" d="M620,292 V404" marker-end="url(#ah)"/>
  <text class="elbl" x="630" y="336">GET /api/shifts</text>
  <path class="edge" d="M770,292 V404" marker-end="url(#ah)"/>
  <text class="elbl" x="780" y="329">POST /send-custom-reminders</text>
  <text class="elbl" x="780" y="343">{subject, message, recipients}</text>

  <!-- ===== Express server ===== -->
  <rect class="group" x="24" y="356" width="952" height="144" rx="12"/>
  <text class="glbl" x="40" y="378">EXPRESS SERVER :3000</text>
  <text class="glbl" x="40" y="394">hackdavis2024/server.js</text>
  <rect class="b-green" x="40" y="408" width="190" height="76" rx="10"/>
  <text class="lbl" x="135" y="432" text-anchor="middle">static pages</text>
  <text class="note" x="135" y="451" text-anchor="middle">express.static('public')</text>
  <text class="note" x="135" y="470" text-anchor="middle">GET /, /login, /register</text>
  <rect class="b-green" x="246" y="408" width="220" height="76" rx="10"/>
  <text class="lbl" x="356" y="432" text-anchor="middle">/register-user, /login-user</text>
  <text class="note" x="356" y="451" text-anchor="middle">plaintext insert / exact match</text>
  <text class="note" x="356" y="470" text-anchor="middle">reply {name, email} or a string</text>
  <rect class="b-green" x="482" y="408" width="200" height="76" rx="10"/>
  <text class="lbl" x="582" y="432" text-anchor="middle">/api/shifts</text>
  <text class="note" x="582" y="451" text-anchor="middle">readExcelData → sheet_to_json</text>
  <text class="note" x="582" y="470" text-anchor="middle">all columns, emails included</text>
  <rect class="b-green" x="698" y="408" width="262" height="76" rx="10"/>
  <text class="lbl" x="829" y="432" text-anchor="middle">/send-custom-reminders</text>
  <text class="note" x="829" y="451" text-anchor="middle">'all' or comma list → forEach send</text>
  <text class="note" x="829" y="470" text-anchor="middle">replies before any send settles</text>

  <!-- ===== Express -> data ===== -->
  <path class="edge" d="M400,484 V588" marker-end="url(#ah)"/>
  <text class="elbl" x="390" y="530" text-anchor="end">Knex insert / select</text>
  <path class="edge" d="M560,484 V588" marker-end="url(#ah)"/>
  <text class="elbl" x="570" y="523">xlsx.readFile on</text>
  <text class="elbl" x="570" y="537">every request</text>
  <path class="edge-dash" d="M730,484 V630 H700" marker-end="url(#ah)"/>
  <text class="elbl" x="740" y="520">re-read on every POST, used only by</text>
  <text class="elbl" x="740" y="534">'all': sheet index 1 is ignored, so</text>
  <text class="elbl" x="740" y="548">it reads sheet 0, never 'Contact Info',</text>
  <text class="elbl" x="740" y="562">and item.email is undefined</text>
  <path class="edge" d="M944,484 V716" marker-end="url(#ah)"/>
  <text class="elbl" x="934" y="646" text-anchor="end">sendReminderEmail() →</text>
  <text class="elbl" x="934" y="660" text-anchor="end">sgMail.send per address</text>

  <!-- ===== Data ===== -->
  <rect class="group" x="24" y="556" width="692" height="128" rx="12"/>
  <text class="glbl" x="40" y="578">DATA — THE SPREADSHEET IS THE DATABASE</text>
  <rect class="b-gray" x="40" y="592" width="380" height="76" rx="10"/>
  <text class="lbl" x="230" y="616" text-anchor="middle">PostgreSQL 'hackdavis2024'</text>
  <text class="note" x="230" y="635" text-anchor="middle">127.0.0.1 · one table: users</text>
  <text class="note" x="230" y="654" text-anchor="middle">name, email, password — logins only</text>
  <rect class="b-gray" x="436" y="592" width="260" height="76" rx="10"/>
  <text class="lbl" x="566" y="616" text-anchor="middle">Test Calendar 2024.xlsx</text>
  <text class="note" x="566" y="635" text-anchor="middle">'Schedule': 79 rows, 77 shifts</text>
  <text class="note" x="566" y="654" text-anchor="middle">Shift Time · Date · Volunteers · Email</text>

  <!-- ===== Email delivery + inboxes ===== -->
  <rect class="b-purple" x="712" y="720" width="248" height="76" rx="10"/>
  <text class="lbl" x="836" y="744" text-anchor="middle">SendGrid @sendgrid/mail</text>
  <text class="note" x="836" y="763" text-anchor="middle">from aggiehouseschedules@gmail.com</text>
  <text class="note" x="836" y="782" text-anchor="middle">API_KEY = '' — fill in source</text>
  <path class="edge" d="M836,796 V892" marker-end="url(#ah)"/>
  <rect class="b-orange" x="712" y="896" width="248" height="56" rx="10"/>
  <text class="lbl" x="836" y="919" text-anchor="middle">Volunteers' inboxes</text>
  <text class="note" x="836" y="939" text-anchor="middle">both paths end here</text>

  <!-- ===== Apps Script path ===== -->
  <rect class="group" x="24" y="716" width="676" height="262" rx="12"/>
  <text class="glbl" x="40" y="738">ZERO-SERVER PATH — automated_reminder/</text>
  <text class="glbl" x="40" y="754">script pasted into Code.gs; sheet uploaded from Formatted Sheet.xlsx</text>
  <rect class="b-planned" x="40" y="768" width="210" height="76" rx="10"/>
  <text class="lbl" x="145" y="792" text-anchor="middle">time-driven Day timer</text>
  <text class="note" x="145" y="811" text-anchor="middle">Google's scheduler, added</text>
  <text class="note" x="145" y="830" text-anchor="middle">by hand (README!.txt)</text>
  <path class="edge" d="M250,806 H296" marker-end="url(#ah)"/>
  <text class="elbl" x="275" y="798" text-anchor="middle">daily</text>
  <rect class="b-red" x="300" y="768" width="384" height="76" rx="10"/>
  <text class="lbl" x="492" y="792" text-anchor="middle">senderEmail()</text>
  <text class="note" x="492" y="811" text-anchor="middle">diff = date − today in days; diff ≤ 2, no lower bound</text>
  <text class="note" x="492" y="830" text-anchor="middle">→ one email to every cell from column D onward</text>
  <path class="edge" d="M340,844 V882" marker-end="url(#ah)"/>
  <text class="elbl" x="350" y="868">getDataRange() every run</text>
  <path class="edge" d="M560,844 V882" marker-end="url(#ah)"/>
  <text class="elbl" x="570" y="868">per address</text>
  <rect class="b-gray" x="40" y="886" width="340" height="76" rx="10"/>
  <text class="lbl" x="210" y="910" text-anchor="middle">Google Sheet 'Sheet1'</text>
  <text class="note" x="210" y="929" text-anchor="middle">Shift · Date · Volunteers · Email …</text>
  <text class="note" x="210" y="948" text-anchor="middle">emails continue rightward from column D</text>
  <rect class="b-purple" x="430" y="886" width="254" height="76" rx="10"/>
  <text class="lbl" x="557" y="910" text-anchor="middle">MailApp.sendEmail</text>
  <text class="note" x="557" y="929" text-anchor="middle">Google's mailer · no API key in script</text>
  <text class="note" x="557" y="948" text-anchor="middle">subject 'AggieHouse Reminder'</text>
  <path class="edge" d="M684,924 H708" marker-end="url(#ah)"/>

  <!-- ===== Legend ===== -->
  <text class="glbl" x="40" y="1008">LEGEND</text>
  <rect class="b-orange" x="40" y="1020" width="26" height="14" rx="4"/>
  <text class="note" x="78" y="1031">people</text>
  <rect class="b-blue" x="230" y="1020" width="26" height="14" rx="4"/>
  <text class="note" x="268" y="1031">static frontend (browser)</text>
  <rect class="b-green" x="470" y="1020" width="26" height="14" rx="4"/>
  <text class="note" x="508" y="1031">Express routes (server.js)</text>
  <rect class="b-gray" x="730" y="1020" width="26" height="14" rx="4"/>
  <text class="note" x="768" y="1031">data store</text>
  <rect class="b-purple" x="40" y="1042" width="26" height="14" rx="4"/>
  <text class="note" x="78" y="1053">email service (external)</text>
  <rect class="b-red" x="230" y="1042" width="26" height="14" rx="4"/>
  <text class="note" x="268" y="1053">Apps Script code</text>
  <rect class="b-planned" x="470" y="1042" width="26" height="14" rx="4"/>
  <text class="note" x="508" y="1053">dashed box = set up by hand, not in code</text>
  <path class="edge" d="M40,1071 H66" marker-end="url(#ah)"/>
  <text class="note" x="78" y="1075">request, call or page load</text>
  <path class="edge-dash" d="M230,1071 H256" marker-end="url(#ah)"/>
  <text class="note" x="268" y="1075">workbook read on every POST that only the broken 'all' branch uses</text>
</svg>
