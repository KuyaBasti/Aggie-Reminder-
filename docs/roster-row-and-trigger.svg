<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1436" width="1000" height="1436" role="img" aria-label="Aggie Reminder, anatomy of a roster row and the daily trigger. Sheet1 columns: A Shift, B Date, C Volunteers, D Email, E with a blank header for extra addresses. getDataRange().getValues() reads the sheet and data.slice(1) drops the header row; each row becomes an array. The script never reads event[0] (shift) or event[2] (names); it reads event[1], the date in column B, twice, and takes every cell from column D to the last column as recipients with event.slice(3), empty or not. Each run, started once a day by a time-driven Day timer trigger or by Run in the editor, clamps today to midnight, then for each row clamps new Date(event[1]) to midnight and computes diff = Math.round((date minus today) / 86,400,000). If diff is at most 2 it calls MailApp.sendEmail once per cell with subject AggieHouse Reminder and body 'This is a reminder for you upcomming volunteer on ' plus event[1]; otherwise, including NaN for a blank or unparseable date, the row is skipped. There is no lower bound, so a past shift passes the check again on every run until its row is deleted or its date is changed. A blank cell reaches MailApp as an empty string; MailApp throws on it (Google-side), nothing catches it, and the run stops. Column E is blank on 7 of the 10 committed rows.">
  <style>
    .bg{fill:#ffffff}
    .title{fill:#1f2328;font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .sub{fill:#59636e;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .lbl{fill:#1f2328;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .note{fill:#59636e;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .glbl{fill:#59636e;font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.06em}
    .elbl{fill:#59636e;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .edge{stroke:#818b98;stroke-width:1.6;fill:none}
    .edge-dash{stroke:#818b98;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .arrow{fill:#818b98}
    .group{fill:none;stroke:#d1d9e0;stroke-width:1.2;stroke-dasharray:4 4}
    .b-blue{fill:#ddf4ff;stroke:#54aeff;stroke-width:1.5}
    .b-green{fill:#dafbe1;stroke:#4ac26b;stroke-width:1.5}
    .b-purple{fill:#fbefff;stroke:#c297ff;stroke-width:1.5}
    .b-orange{fill:#fff1e5;stroke:#fb8f44;stroke-width:1.5}
    .b-gray{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1.5}
    .b-red{fill:#ffebe9;stroke:#ff8182;stroke-width:1.5}
    .b-planned{fill:none;stroke:#818b98;stroke-width:1.4;stroke-dasharray:5 4}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .wire{stroke:#59636e;stroke-width:1.4;fill:none}
    .dot{fill:#59636e}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .title,.lbl{fill:#e6edf3}
      .sub,.note,.glbl,.elbl{fill:#9198a1}
      .edge,.edge-dash{stroke:#9198a1}
      .arrow{fill:#9198a1}
      .group{stroke:#3d444d}
      .b-blue{fill:#0c2d6b;stroke:#4493f8}
      .b-green{fill:#0f3b1e;stroke:#3fb950}
      .b-purple{fill:#2e1a4f;stroke:#ab7df8}
      .b-orange{fill:#3d1f0a;stroke:#f0883e}
      .b-gray{fill:#151b23;stroke:#3d444d}
      .b-red{fill:#3c1618;stroke:#f85149}
      .b-planned{stroke:#9198a1}
      .wire{stroke:#9198a1}
      .dot{fill:#9198a1}
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="1436" rx="12"/>
  <text class="title" x="32" y="48">Aggie Reminder — anatomy of a roster row, and the daily trigger</text>
  <text class="sub" x="32" y="74">Of each row, the script reads only the date in B and every cell from D rightward; A and C never matter.</text>

  <!-- ================= (a) THE ROW ================= -->
  <rect class="group" x="24" y="96" width="952" height="334" rx="12"/>
  <text class="glbl" x="40" y="120">THE ROW — WHICH CELLS OF SHEET1 THE SCRIPT READS</text>
  <text class="elbl mono" x="960" y="120" text-anchor="end">automated_reminder.txt lines 2–4, 9, 13, 16</text>

  <!-- column letters -->
  <text class="elbl" x="40" y="148">column</text>
  <text class="note mono" x="230" y="148" text-anchor="middle">A</text>
  <text class="note mono" x="342.5" y="148" text-anchor="middle">B</text>
  <text class="note mono" x="477.5" y="148" text-anchor="middle">C</text>
  <text class="note mono" x="655" y="148" text-anchor="middle">D</text>
  <text class="note mono" x="845" y="148" text-anchor="middle">E</text>

  <!-- row 1: header, dropped by data.slice(1) -->
  <text class="note" x="40" y="180">row 1 · header</text>
  <rect class="b-gray" x="172" y="158" width="116" height="34" rx="3"/>
  <rect class="b-gray" x="292" y="158" width="101" height="34" rx="3"/>
  <rect class="b-gray" x="397" y="158" width="161" height="34" rx="3"/>
  <rect class="b-gray" x="562" y="158" width="186" height="34" rx="3"/>
  <rect class="b-gray" x="752" y="158" width="186" height="34" rx="3"/>
  <text class="note mono" x="230" y="180" text-anchor="middle">Shift</text>
  <text class="note mono" x="342.5" y="180" text-anchor="middle">Date</text>
  <text class="note mono" x="477.5" y="180" text-anchor="middle">Volunteers</text>
  <text class="note mono" x="655" y="180" text-anchor="middle">Email</text>
  <text class="note mono" x="845" y="180" text-anchor="middle">(blank)</text>

  <!-- row 4: two addresses -->
  <text class="note" x="40" y="218">row 4</text>
  <rect class="b-gray" x="172" y="196" width="116" height="34" rx="3"/>
  <rect class="b-blue" x="292" y="196" width="101" height="34" rx="3"/>
  <rect class="b-gray" x="397" y="196" width="161" height="34" rx="3"/>
  <rect class="b-green" x="562" y="196" width="186" height="34" rx="3"/>
  <rect class="b-green" x="752" y="196" width="186" height="34" rx="3"/>
  <text class="note mono" x="230" y="218" text-anchor="middle">7PM-8:30AM</text>
  <text class="note mono" x="342.5" y="218" text-anchor="middle">May 2</text>
  <text class="note mono" x="477.5" y="218" text-anchor="middle">‹name›, ‹name›</text>
  <text class="note mono" x="655" y="218" text-anchor="middle">‹address›</text>
  <text class="note mono" x="845" y="218" text-anchor="middle">‹address›</text>

  <!-- row 5: one address, E blank -->
  <text class="note" x="40" y="256">row 5</text>
  <rect class="b-gray" x="172" y="234" width="116" height="34" rx="3"/>
  <rect class="b-blue" x="292" y="234" width="101" height="34" rx="3"/>
  <rect class="b-gray" x="397" y="234" width="161" height="34" rx="3"/>
  <rect class="b-green" x="562" y="234" width="186" height="34" rx="3"/>
  <rect class="b-red" x="752" y="234" width="186" height="34" rx="3"/>
  <text class="note mono" x="230" y="256" text-anchor="middle">7PM-8:30AM</text>
  <text class="note mono" x="342.5" y="256" text-anchor="middle">May 18</text>
  <text class="note mono" x="477.5" y="256" text-anchor="middle">‹name›</text>
  <text class="note mono" x="655" y="256" text-anchor="middle">‹address›</text>
  <text class="note mono" x="845" y="256" text-anchor="middle">''  (empty cell)</text>

  <!-- array indexes -->
  <text class="elbl" x="40" y="290">array index</text>
  <text class="note mono" x="230" y="290" text-anchor="middle">event[0]</text>
  <text class="note mono" x="342.5" y="290" text-anchor="middle">event[1]</text>
  <text class="note mono" x="477.5" y="290" text-anchor="middle">event[2]</text>
  <text class="note mono" x="655" y="290" text-anchor="middle">event[3]</text>
  <text class="note mono" x="845" y="290" text-anchor="middle">event[4]</text>

  <!-- slice(3) bracket: D to the last column -->
  <path class="wire" d="M562,298 V310"/>
  <path class="edge" d="M562,304 H956" marker-end="url(#ah)"/>

  <!-- what each column is for -->
  <text class="lbl" x="230" y="330" text-anchor="middle">never read</text>
  <text class="note" x="230" y="348" text-anchor="middle">not in the email</text>
  <text class="lbl" x="342.5" y="330" text-anchor="middle">read twice</text>
  <text class="note" x="342.5" y="348" text-anchor="middle">date math + body</text>
  <text class="lbl" x="477.5" y="330" text-anchor="middle">never read</text>
  <text class="note" x="477.5" y="348" text-anchor="middle">names not in the email</text>
  <text class="lbl mono" x="750" y="330" text-anchor="middle">emails = event.slice(3)</text>
  <text class="note" x="750" y="348" text-anchor="middle">every cell from D to the last column of the range,</text>
  <text class="note" x="750" y="364" text-anchor="middle">each one handed to MailApp, empty or not</text>

  <!-- footnotes -->
  <text class="note" x="40" y="388">Sample rows 4–5 of the committed Formatted Sheet.xlsx, names and addresses masked; data.slice(1) drops header row 1.</text>
  <text class="note" x="40" y="404">Only D1 is headed Email; E1 is blank, and extra addresses go in the next cell to the right (README!.txt step 3).</text>
  <text class="note" x="40" y="420">getDataRange() is the used rectangle, so a short row's empty cells come back as <tspan class="mono">''</tspan> (Google-side behaviour).</text>

  <g transform="translate(0,12)">
  <!-- ================= (b) EACH RUN ================= -->
  <rect class="group" x="24" y="438" width="952" height="930" rx="12"/>
  <text class="glbl" x="40" y="462">EACH RUN — ONE CALL OF senderEmail()</text>
  <text class="elbl mono" x="960" y="462" text-anchor="end">automated_reminder.txt lines 1–23 · README!.txt</text>

  <!-- how a run starts (Google-side) -->
  <rect class="b-planned" x="104" y="480" width="440" height="56" rx="10"/>
  <text class="lbl" x="324" y="503" text-anchor="middle">Time-driven trigger · Day timer</text>
  <text class="note" x="324" y="522" text-anchor="middle">once a day, at the time of day picked (README!.txt steps 8–12)</text>

  <rect class="b-planned" x="576" y="480" width="364" height="56" rx="10"/>
  <text class="lbl" x="758" y="503" text-anchor="middle">Run in the Apps Script editor</text>
  <text class="note" x="758" y="522" text-anchor="middle">sends right away (README!.txt note)</text>

  <path class="edge" d="M324,536 V568" marker-end="url(#ah)"/>
  <path class="edge" d="M758,536 V600 H548" marker-end="url(#ah)"/>

  <!-- read the sheet -->
  <rect class="b-purple" x="104" y="572" width="440" height="56" rx="10"/>
  <text class="lbl mono" x="324" y="595" text-anchor="middle">data = getDataRange().getValues()</text>
  <text class="note" x="324" y="614" text-anchor="middle">Sheet1, re-read on every run · events = data.slice(1)</text>
  <path class="edge" d="M324,628 V648" marker-end="url(#ah)"/>

  <!-- today -->
  <rect class="b-blue" x="104" y="652" width="440" height="56" rx="10"/>
  <text class="lbl mono" x="324" y="675" text-anchor="middle">today = new Date()</text>
  <text class="note" x="324" y="694" text-anchor="middle">setHours(0, 0, 0, 0): midnight · computed once per run</text>
  <path class="edge" d="M324,708 V764" marker-end="url(#ah)"/>

  <!-- ===== per-row loop ===== -->
  <rect class="group" x="44" y="728" width="912" height="624" rx="12"/>
  <text class="glbl" x="60" y="750">FOR EACH ROW</text>
  <text class="elbl mono" x="940" y="750" text-anchor="end">events.forEach · line 8</text>

  <!-- date -->
  <rect class="b-blue" x="104" y="768" width="440" height="56" rx="10"/>
  <text class="lbl mono" x="324" y="791" text-anchor="middle">date = new Date(event[1])</text>
  <text class="note" x="324" y="810" text-anchor="middle">column B · setHours(0, 0, 0, 0): midnight</text>
  <path class="edge" d="M324,824 V844" marker-end="url(#ah)"/>

  <!-- diff -->
  <rect class="b-blue" x="104" y="848" width="440" height="56" rx="10"/>
  <text class="lbl mono" x="324" y="871" text-anchor="middle">diff = Math.round((date − today) / 86,400,000)</text>
  <text class="note" x="324" y="890" text-anchor="middle">1000*60*60*24 ms per day → whole days</text>
  <path class="edge" d="M324,904 V940" marker-end="url(#ah)"/>

  <!-- decision -->
  <polygon class="b-blue" points="324,944 434,980 324,1016 214,980"/>
  <text class="lbl mono" x="324" y="985" text-anchor="middle">diff &lt;= 2 ?</text>

  <path class="edge" d="M434,980 H572" marker-end="url(#ah)"/>
  <text class="elbl" x="503" y="972" text-anchor="middle">no</text>
  <rect class="b-gray" x="576" y="952" width="364" height="56" rx="10"/>
  <text class="lbl" x="758" y="975" text-anchor="middle">row skipped, on to the next</text>
  <text class="note" x="758" y="994" text-anchor="middle">diff ≥ 3, or NaN when B is blank or unparseable</text>

  <path class="edge" d="M324,1016 V1052" marker-end="url(#ah)"/>
  <text class="elbl" x="334" y="1038">yes</text>

  <!-- which diffs send: number line -->
  <text class="lbl" x="576" y="782">Which diff values send</text>
  <rect class="b-green" x="576" y="792" width="242" height="20" rx="3"/>
  <rect class="b-gray" x="822" y="792" width="118" height="20" rx="3"/>
  <text class="elbl" x="697" y="806" text-anchor="middle">sends</text>
  <text class="elbl" x="881" y="806" text-anchor="middle">skips</text>
  <path class="edge" d="M580,826 H936" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <path class="wire" d="M600,821 V831 M640,821 V831 M680,821 V831 M720,821 V831 M760,821 V831 M800,821 V831 M840,821 V831 M880,821 V831"/>
  <text class="note mono" x="600" y="846" text-anchor="middle">−3</text>
  <text class="note mono" x="640" y="846" text-anchor="middle">−2</text>
  <text class="note mono" x="680" y="846" text-anchor="middle">−1</text>
  <text class="note mono" x="720" y="846" text-anchor="middle">0</text>
  <text class="note mono" x="760" y="846" text-anchor="middle">+1</text>
  <text class="note mono" x="800" y="846" text-anchor="middle">+2</text>
  <text class="note mono" x="840" y="846" text-anchor="middle">+3</text>
  <text class="note mono" x="880" y="846" text-anchor="middle">+4</text>

  <rect class="b-red" x="576" y="862" width="364" height="72" rx="10"/>
  <text class="lbl" x="758" y="886" text-anchor="middle">No lower bound</text>
  <text class="note" x="758" y="905" text-anchor="middle">a past shift (diff &lt; 0) passes the check on every run,</text>
  <text class="note" x="758" y="921" text-anchor="middle">until its row is deleted or its date is changed</text>

  <!-- recipients -->
  <rect class="b-green" x="104" y="1056" width="440" height="72" rx="10"/>
  <text class="lbl mono" x="324" y="1080" text-anchor="middle">emails = event.slice(3)</text>
  <text class="note" x="324" y="1099" text-anchor="middle">cells D, E, … to the last column of the range</text>
  <text class="note" x="324" y="1115" text-anchor="middle">Logger.log(emails.length): the script's only log line</text>
  <path class="edge" d="M324,1128 V1148" marker-end="url(#ah)"/>

  <!-- send -->
  <rect class="b-green" x="104" y="1152" width="440" height="72" rx="10"/>
  <text class="lbl mono" x="324" y="1176" text-anchor="middle">MailApp.sendEmail(email, subject, body)</text>
  <text class="note" x="324" y="1195" text-anchor="middle">one call per cell, j = 0 … emails.length − 1</text>
  <text class="note" x="324" y="1211" text-anchor="middle">no check for an empty or invalid address</text>
  <path class="edge" d="M544,1188 H572" marker-end="url(#ah)"/>

  <!-- the message -->
  <rect class="b-green" x="576" y="1152" width="364" height="72" rx="10"/>
  <text class="lbl" x="592" y="1176">subject: <tspan class="mono">AggieHouse Reminder</tspan></text>
  <text class="note mono" x="592" y="1195">body: "This is a reminder for you upcomming</text>
  <text class="note mono" x="635" y="1211">volunteer on " + event[1]</text>
  <text class="note" x="576" y="1244">event[1] is the raw column-B cell, not the clamped date</text>

  <!-- loop back -->
  <path class="edge" d="M104,1188 H70 V796 H100" marker-end="url(#ah)"/>
  <text class="elbl" x="78" y="984">next row</text>

  <!-- blank cell: run ends -->
  <path class="edge-dash" d="M324,1224 V1264" marker-end="url(#ah)"/>
  <text class="elbl" x="334" y="1248">when the cell is <tspan class="mono">''</tspan></text>
  <rect class="b-planned" x="104" y="1268" width="440" height="56" rx="10"/>
  <text class="lbl" x="324" y="1291" text-anchor="middle">MailApp throws on a blank recipient</text>
  <text class="note" x="324" y="1310" text-anchor="middle">Google-side behaviour, not in the script</text>
  <path class="edge" d="M544,1296 H572" marker-end="url(#ah)"/>

  <rect class="b-red" x="576" y="1260" width="364" height="72" rx="10"/>
  <text class="lbl" x="758" y="1284" text-anchor="middle">Nothing catches it: the run stops</text>
  <text class="note" x="758" y="1303" text-anchor="middle">every later row goes unsent on this run</text>
  <text class="note" x="758" y="1319" text-anchor="middle">E is blank on 7 of the 10 committed rows</text>

  <!-- ================= legend ================= -->
  <rect class="b-purple" x="32" y="1388" width="14" height="14" rx="3"/>
  <text class="elbl" x="52" y="1399">Sheet1 read</text>
  <rect class="b-blue" x="138" y="1388" width="14" height="14" rx="3"/>
  <text class="elbl" x="158" y="1399">date math (column B)</text>
  <rect class="b-green" x="294" y="1388" width="14" height="14" rx="3"/>
  <text class="elbl" x="314" y="1399">recipients (D onward) and the send</text>
  <rect class="b-gray" x="512" y="1388" width="14" height="14" rx="3"/>
  <text class="elbl" x="532" y="1399">never read, or skipped</text>
  <rect class="b-red" x="676" y="1388" width="14" height="14" rx="3"/>
  <text class="elbl" x="696" y="1399">sharp edge</text>
  <rect class="b-planned" x="776" y="1388" width="14" height="14" rx="3"/>
  <text class="elbl" x="796" y="1399">Google-side, not in the script</text>
  </g>
</svg>
